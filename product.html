<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="canonical" href="https://willzart.netlify.app/">
  <title>Producto | WILLZART</title>
  <meta name="description"
    content="WILLZART es una marca de ropa colombiana, 100% artesanal, que combina estilo, elegancia y simplicidad. Diseños únicos hechos a mano, destacando lo mejor de la moda sostenible y auténtica.">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/manifest/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/manifest/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/manifest/apple-touch-icon.png">
  <link rel="mask-icon" href="/assets/manifest/safari-pinned-tab.svg" color="#0f0f0f">
  <link rel="manifest" href="/assets/manifest/manifest.webmanifest">
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="msapplication-starturl" content="/">
  <meta name="msapplication-config" content="/assets/manifest/browserconfig.xml">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://willzart.netlify.app/">
  <meta property="og:title" content="WILLZART">
  <meta property="og:description"
    content="WILLZART es una marca de ropa colombiana, 100% artesanal, que combina estilo, elegancia y simplicidad. Diseños únicos hechos a mano, destacando lo mejor de la moda sostenible y auténtica.">
  <meta property="og:image" content="https://willzart.netlify.app/assets/manifest/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WILLZART">
  <meta name="twitter:description"
    content="WILLZART es una marca de ropa colombiana, 100% artesanal, que combina estilo, elegancia y simplicidad. Diseños únicos hechos a mano, destacando lo mejor de la moda sostenible y auténtica.">
  <meta name="twitter:image" content="https://willzart.netlify.app/assets/manifest/og.png">
  <meta name="keywords"
    content="WILLZART, ropa artesanal, moda colombiana, estilo elegante, simplicidad, moda sostenible, ropa hecha a mano, diseño exclusivo, ropa ecológica, ropa auténtica, diseño colombiano, moda artesanal, moda de lujo, ropa minimalista, elegancia artesanal, moda consciente">
  <meta name="format-detection" content="telephone=no">
  <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <link href="assets/css/product.css" rel="stylesheet" />
  <link href="assets/css/bootstrap-icons.css" rel="stylesheet" />
</head>

<body>
  <div id="preloader" class="active">
    <div class="loader-content"></div>
  </div>

  <main class="bg-light">
    <section class="product-page bg-light text-dark" id="product-app">
      <div class="breadcrumbs" id="prd-bc"></div>
      <div class="detail" id="prd-detail" hidden>
        <!-- Galería -->
        <section class="gallery">
          <div class="viewer" id="prd-viewer" aria-label="Visor de imágenes">
            <img id="prd-viewer-img" alt="" onerror="this.onerror=null; this.src='/assets/images/no-image.webp';">
          </div>
          <div class="thumbs" id="prd-thumbs"></div>
        </section>

        <!-- Información -->
        <section class="info">
          <h1 id="prd-name"></h1>
          <div class="price" id="prd-price"></div>
          <div id="prd-badges" class="mb-2"></div>

          <div class="meta">
            <div class="kv"><span class="k">Colores:</span>
              <div class="chips" id="prd-colors"></div>
            </div>
            <div class="kv"><span class="k">Tallas:</span>
              <div class="chips" id="prd-sizes"></div>
            </div>
            <div class="kv"><span class="k">Materiales:</span>
              <div class="chips" id="prd-materials"></div>
            </div>
            <div class="kv"><span class="k">Etiquetas:</span>
              <div class="chips" id="prd-tags"></div>
            </div>
          </div>

          <div class="specs">
            <h2>Especificaciones</h2>
            <ul id="prd-specs"></ul>
          </div>

          <div class="backline">
            <button onclick="window.location.href='catalogo.html'" class="btn btn-secondary rounded-pill px-3"
              type="button">Volver a Catálogo</button>
            <button id="btnIrPagina" class="btn btn-success rounded-pill px-3" type="button">
              <i class="bi bi-cart"></i> Cómo Comprar
            </button>
          </div>
        </section>
      </div>

      <div id="prd-error" class="alert alert-danger show mt-5" data-bs-theme="light" hidden>
        No se pudo cargar el producto.
      </div>
    </section>
  </main>
  <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/product.js"></script>
  <script>
    document.getElementById('btnIrPagina').addEventListener('click', function () {
      const btn = this;

      btn.innerHTML = `
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Cargando...
    `;

      btn.disabled = true;

      setTimeout(() => {
        window.location.href = 'comocomprar.html';
      }, 500);
    });
  </script>
</body>

</html>

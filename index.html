    content="WILLZART, ropa artesanal, moda colombiana, estilo elegante, simplicidad, moda sostenible, ropa hecha a mano, diseño exclusivo, ropa ecológica, ropa auténtica, diseño colombiano, moda artesanal, moda de lujo, ropa minimalista, elegancia artesanal, moda consciente">

</head>

<body>
  <div id="preloader" class="active">
    <div class="loader-content"></div>
  </div>

  <main>
    <section id="home-carrousel" class="carousel slide" data-bs-ride="carousel" aria-label="Slider Home"
      data-bs-theme="light">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="assets/images/media/nosotros/banner/background@xxl.webp" class="d-block w-100" alt="Nueva Colección">
          <div class="carousel-caption">
            <h2 class="fw-bold">Nueva Colección</h2>
            <p>Descubre nuestras nueva colección.</p>
            <a href="catalogo.html" class="btn btn-primary hero-btn">Ver colección</a>
          </div>
        </div>
        <div class="carousel-item">
          <img src="assets/images/media/home/intro/image-1@xxl.webp" class="d-block w-100" alt="Línea deportiva">
          <div class="carousel-caption">
            <h2 class="fw-bold">Línea deportiva</h2>
            <p>Rendimiento y estilo en cada movimiento.</p>
            <a href="catalogo.html?deportiva=1" class="btn btn-primary hero-btn">Línea deportiva</a>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#home-carrousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#home-carrousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#home-carrousel" data-bs-slide-to="0" class="active" aria-current="true"
          aria-label="1"></button>
        <button type="button" data-bs-target="#home-carrousel" data-bs-slide-to="1" aria-label="2"></button>
        <button type="button" data-bs-target="#home-carrousel" data-bs-slide-to="2" aria-label="3"></button>
      </div>
    </section>

    <section class="bg-light text-dark">
      <div class="products" aria-labelledby="products-title">
        <div class="products__head">
          <h2 id="products-title">Productos Destacados</h2>
          <a class="products__more" href="catalogo.html">Ver todos</a>
        </div>
        <div class="products__head">
          <nav class="products__tabs" role="tablist" aria-label="Categorías"></nav>
        </div>

        <div class="products__carousels"></div>
      </div>
    </section>

  </main>

  <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
